name: CI
run-name: CI Workflow
on:
  - push
  - pull_request
permissions:
  contents: read
jobs:
  audit:
    name: 🛡️ Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - name: 🛡️ Audit
        run: npm audit --include=dev --audit-level=high
  format:
    name: 🔬 Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - name: 📥 Install dependencies
        run: npm ci --include=dev --include=optional --bin-links
      - name: 🔬 Format
        run: npm run format:check
  lint:
    name: ⬣ ESLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - name: 📥 Install dependencies
        run: npm ci --include=dev --include=optional --bin-links
      - name: ⬣ ESLint
        run: npm run lint:check
  spell:
    name: 🈸 Spellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - name: 📥 Install dependencies
        run: npm ci --include=dev --include=optional --bin-links
      - name: 🈸 Spellcheck
        run: npm run spell:check
  type:
    name: ʦ Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - name: 📥 Install dependencies
        run: npm ci --include=dev --include=optional --bin-links
      - name: ʦ Typecheck
        run: npm run type:check
  test:
    name: ⚡ Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - name: 📥 Install dependencies
        run: npm ci --include=dev --include=optional --bin-links
      - name: ⚡ Tests
        run: npm run test:coverage
  build:
    name: 🚀 Build
    needs:
      - audit
      - format
      - lint
      - spell
      - type
      - test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - name: 📥 Install dependencies
        run: npm ci --include=dev --include=optional --bin-links
      - name: 🔨 Build
        run: npm run build
      - name: 📦 Package checks
        run: npm run test:package
      - name: 📦 Package contents
        run: npm pack --dry-run --ignore-scripts
  windows:
    name: 🪟 Windows compatibility
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - name: 📥 Install dependencies
        run: npm ci --include=dev --include=optional --bin-links
      - name: 🔬 Format
        run: npm run format:check
      - name: ⬣ ESLint
        run: npm run lint:check
      - name: 🈸 Spellcheck
        run: npm run spell:check
      - name: ʦ Typecheck
        run: npm run type:check
      - name: ⚡ Tests and coverage
        run: npm run test:coverage
      - name: 🔨 Build
        run: npm run build
      - name: 📦 Package checks
        run: npm run test:package
      - name: 📦 Package contents
        run: npm pack --dry-run --ignore-scripts
  runtime:
    name: 🧪 Node.js ${{ matrix.node }} runtime
    needs:
      - build
      - windows
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node:
          - 18.0.0
          - "20"
          - "22"
          - "24"
          - "26"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - name: 📥 Install dependencies
        run: npm ci --include=dev --include=optional --bin-links
      - name: 🔨 Build on Node.js 24
        run: npm run build
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - name: 📦 Runtime package checks
        run: npm run test:package
